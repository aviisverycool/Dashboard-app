<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['source-sans-pro', 'sans-serif', 'system-ui', 'ui-sans-serif'],
                    },
                },
            },
        };
    </script>
    <script src="script.js" defer></script>
    </head>
<body class="bg-white text-slate-800 antialiased">
  <div class="flex flex-col md:flex-row min-h-screen">

  <!-- Sidebar -->
  <aside class="md:w-[260px] md:flex-none w-full bg-slate-100 border-b md:border-b md:border-r border-slate-200 px-5 py-6">
  
    <!-- Data source -->
     <h2 class="text-lg font-semibold mb-3">Data Source</h2>

     <div class="flex gap-2 mb-3">
        <button type="button" data-source-tab="upload" class="source-tab flex-1 text-xs px-2 py-1.5 rounded border border-slate-200 bg-white cursor-pointer">Upload</button>
        <button type="button" data-source-tab="paste" class="source-tab flex-1 text-xs px-2 py-1.5 rounded border border-slate-200 bg-white cursor-pointer">Paste</button>
        <button type="button" data-source-tab="manual" class="source-tab flex-1 text-xs px-2 py-1.5 rounded border border-slate-200 bg-white cursor-pointer">Manual</button>
     </div>

     <div data-source-panel="upload" class="source-panel mb-5">
        <label for="file-input" class="block text-xs text-slate-600 mb-5">CSV or JSON File</label>
        <input type="file" id="file-input" accept=".csv,.json,text/csv,application/json" class="block w-full text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-medium file:bg-blue-100 file:text-blue-900 hover:file:bg-blue-200 cursor-pointer"/>
    </div>

    <div data-source-panel="paste" class="source-panel mb-5 hidden">
        <label for="paste-input" class="block text-xs text-slate-600 mb-1.5">Paste CSV or JSON</label>
        <textarea id="paste-input" rows="6" spellcheck="false" class="w-full text-xs font-mono border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
        <button type="button" id="paste-apply" class="mt-2 w-full text-xs px-3 py-1.5 rounded bg-blue-100 text-blue-900 border border-blue-300 hover:bg-blue-200 cursor-pointer">Apply pasted data</button>
    </div>

    <div data-source-panel="manual" class="source-panel mb-5 hidden">
        <div class="flex gap-1.5 mb-2">
            <input type="text" id="manual-category" placeholder="Category" class="w-0 flex-1 text-xs border border-slate-300 rounded px-2 py-1.5"/>
            <input type="number" id="manual-value" placeholder="value" class="w-20 text-xs border border-slate-300 rounded px-2 py-1.5"/>            
        </div>
        <button type="button" id="manual-add" class="w-full text-xs px-3 py-1.5 rounded bg-blue-100 text-blue-900 border border-blue-300 hover:bg-blue-200 cursor-pointer">Add Row</button>
        <div id="manual-rows" class="mt-3 space-y-1"></div>
        <button type="button" id="manual-clear" class="mt-3 w-full text-xs px-3 py-1 rounded border border-slate-300 bg-white text-slate-500 hover:border-slate-400 cursor-pointer">Clear all rows</button>
    </div>

    <button type="button" id="reset-data" class="w-full text-xs px-3 py-1.5 rounded border border-slate-300 bg-white text-slate-600 hover:border-slate-400 cursor-pointer mb-6">Reset to sample data</button>
    <h2 class="text-lg font-semibold mb-4">Filters</h2>
  
  <span id="multiselect-label" class="block text-sm mb-1.5">Choose Categories</span>

  <div id="chips" role="group" aria-labelledby="multiselect-label" class="flex flex-wrap gap-1.5 mb-2"></div>

  <p class="text-xs text-slate-500 mb-5">
    Only applied when "Show all" is selected.
  </p>

  <label for="show-all" class="flex items-center gap-2 text-sm cursor-pointer select-none">
    <input type="checkbox" id="show-all" checked class="accent-red-500 cursor-pointer"/>
    <span>Show all</span>
  </label>
  </aside>

  <!-- MAIN STUFF -->
   <main class="flex-1 min-w-0 px-5 py-7 md:px-12 md:pt-12 md:pb-16 max-w-[1200px]">
    <h1 class="text-3xl md:text-4xl font-bold mb-0.5">Dashboard App</h1>

    <!-- actual chart-->
   <div class="flex flex-col md:flex-row gap-8">
    <section class="flex-[3_1_0] w-full min-w-0"> 
        <h3 class="text-base font-semibold">My Chart</h3>
        <div id="chart-host"></div>
    </section>

    <!-- metrics -->
     <section class="flex-[1_1_0] w-full md:min-w-[160px]">
        <div class="mb-5">
            <div class="text-xs text-slate-500 mb-1.5">Total</div>
            <div id="metric-total" class="text-3xl font-semibold leading-tight">0</div>
        </div>
        <div class="mb-5">
            <div class="text-xs text-slate-500 mb-0.5">Average</div>
            <div id="metric-avg" class="text-3xl font-semibold leading-tight">0.0</div>
        </div>
     </section>

   </div>

   <!-- raw data opener/expander -->
   <details class="group mt-10 border border-slate-200 rounded-lg bg-white overflow-hidden">
    <summary class="list-none [&::-webkit-details-marker]:hidden cursor-pointer select-none px-4 py-3 text-sm flex items-center">
        <span class="inline-block text-[0.65rem] mr-2.5 text-slate-500 transition-transform duration-150 group-open:rotate-90">▶</span>
        View Raw Data
    </summary>
    
    <div class="px-4 pb-4 overflow-x-auto">
        <table class="w-full text-sm border-collapse">
            <thead>
                <tr>
                    <th class="text-left font-semibold text-slate-500 bg-slate-50 px-3 py-2 border-b border-slate-200">category</th>
                    <th class="text-left font-semibold text-slate-500 bg-slate-50 px-3 py-2 border-b border-slate-200">values</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
   </details>
   </main>
   
  </div>
</body>
</html>
